services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: runtime
    env_file:
      - server/.env.docker
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "const r = await fetch('http://127.0.0.1:3000/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 12
