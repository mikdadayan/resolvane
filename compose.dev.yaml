services:
  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
      target: development
    init: true
    environment:
      # This address is used by the browser on the host, not by the container.
      VITE_SERVER_BASE_URL: http://localhost:3000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./client/src:/app/client/src:ro
      - ./client/public:/app/client/public:ro
      - ./client/index.html:/app/client/index.html:ro
      - ./core/src:/app/core/src:ro
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "const r = await fetch('http://127.0.0.1:5173/'); process.exit(r.ok ? 0 : 1)"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 12
  backend:
    build:
      target: development
    environment:
      NODE_ENV: development
    init: true
    volumes:
      - ./server/src:/app/server/src:ro
      # Preserve the generated Linux Prisma client underneath the source mount.
      - /app/server/src/generated/prisma
      - ./core/src:/app/core/src:ro
      - ./server/knowledge-base.md:/app/server/knowledge-base.md:ro
