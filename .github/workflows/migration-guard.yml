name: Migration Guard

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-immutable-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Keep the workflow/job present for required checks and release verification.
      # Only the inspection step is conditional, not the workflow trigger.
      - name: Detect migration changes
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.after }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE=$(git merge-base "$BASE" "$HEAD")
          elif [[ "$BASE" =~ ^0+$ ]]; then
            BASE=$(git mktree </dev/null)
          fi

          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          CHANGED=$(git diff --name-only --no-renames "$BASE" "$HEAD" -- server/prisma/migrations)
          if [ -n "$CHANGED" ]; then
            echo "migrations_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "migrations_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check no already-committed migration file was modified or deleted
        if: steps.changes.outputs.migrations_changed == 'true'
        env:
          BASE: ${{ steps.changes.outputs.base }}
          HEAD: ${{ steps.changes.outputs.head }}
        run: |
          CHANGED=$(git diff --name-status --no-renames --diff-filter=MD "$BASE" "$HEAD" -- server/prisma/migrations)

          if [ -n "$CHANGED" ]; then
            echo "The following already-committed migration file(s) were modified or deleted:"
            echo "$CHANGED"
            echo ""
            echo "Editing or deleting an existing migration is not allowed — create a new migration instead."
            exit 1
          fi

          echo "No existing migration files were modified or deleted."

      - name: Skip inspection for unrelated changes
        if: steps.changes.outputs.migrations_changed == 'false'
        run: echo "No migration files changed; migration inspection is not needed."
