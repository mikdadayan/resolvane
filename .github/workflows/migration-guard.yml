name: Migration Guard

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check-immutable-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check no already-committed migration file was modified or deleted
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.after }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE=$(git merge-base "$BASE" "$HEAD")
          elif [[ "$BASE" =~ ^0+$ ]]; then
            BASE=$(git mktree </dev/null)
          fi

          CHANGED=$(git diff --name-status --no-renames --diff-filter=MD "$BASE" "$HEAD" -- server/prisma/migrations)

          if [ -n "$CHANGED" ]; then
            echo "The following already-committed migration file(s) were modified or deleted:"
            echo "$CHANGED"
            echo ""
            echo "Editing or deleting an existing migration is not allowed — create a new migration instead."
            exit 1
          fi

          echo "No existing migration files were modified or deleted."
