name: Release frontend testing

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New frontend version, e.g. 1.2.0 (leave empty for rollback)"
        required: false
        type: string
      rollback_version:
        description: "Restore a published frontend version, e.g. 1.1.0 (leave version empty)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: frontend-release-testing
  cancel-in-progress: false

jobs:
  checks:
    name: Verify CI and select release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      release_tag: ${{ steps.source.outputs.release_tag }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      rollback: ${{ steps.source.outputs.rollback }}
    steps:
      - name: Require master and successful checks for this exact commit
        id: source
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          ROLLBACK_VERSION: ${{ inputs.rollback_version }}
        with:
          script: |
            if (context.ref !== 'refs/heads/master') {
              throw new Error('Frontend releases must run from master.');
            }
            for (const workflow of ['client-quality-checks.yml', 'migration-guard.yml']) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...context.repo,
                workflow_id: workflow,
                head_sha: context.sha,
                event: 'push',
                per_page: 1,
              });
              if (data.workflow_runs[0]?.conclusion !== 'success') {
                throw new Error(`${workflow} must pass for ${context.sha} before release. Wait for CI, then rerun this workflow.`);
              }
            }
            const version = process.env.RELEASE_VERSION?.trim();
            const rollbackVersion = process.env.ROLLBACK_VERSION?.trim();
            const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
            if (!!version === !!rollbackVersion || !semver.test(version || rollbackVersion)) {
              throw new Error('Supply exactly one of version or rollback_version, such as 1.2.0 without a v prefix.');
            }
            const tag = `frontend/v${version || rollbackVersion}`;
            core.setOutput('release_tag', tag);
            if (version) {
              try {
                await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` });
                throw new Error(`Tag ${tag} already exists. Choose a new version.`);
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              core.setOutput('source_sha', context.sha);
              core.setOutput('rollback', 'false');
              return;
            }
            const { data: release } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
            if (release.draft || !/^[a-f0-9]{40}$/.test(release.target_commitish)
                || !['frontend-dist.tar.gz', 'release.json'].every(name => release.assets.some(asset => asset.name === name))) {
              throw new Error('Rollback requires a published frontend release with an exact source SHA, build archive, and release metadata.');
            }
            core.setOutput('source_sha', release.target_commitish);
            core.setOutput('rollback', 'true');

  build:
    name: Build frontend
    needs: checks
    if: needs.checks.outputs.rollback == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Prisma generation/type checking needs a URL, but never connects to this DB.
      DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma types used by the auth client
        run: pnpm --filter @resolvane/server exec prisma generate
      - name: Build client and its shared package
        run: pnpm run build --filter=@resolvane/client
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: client/dist/
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy frontend to testing
    needs: [checks, build]
    # Rollback intentionally skips build, but failed checks/build must still block uploads.
    if: >-
      !cancelled() && needs.checks.result == 'success' &&
      (needs.build.result == 'success' ||
       (needs.checks.outputs.rollback == 'true' && needs.build.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testing
      url: ${{ vars.FRONTEND_URL }}
    permissions:
      contents: read
      id-token: write
    env:
      FRONTEND_S3_BUCKET: ${{ vars.FRONTEND_S3_BUCKET }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
    steps:
      - name: Require smoke-test account before uploading
        env:
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: |
          if [ -z "$SMOKE_EMAIL" ] || [ -z "$SMOKE_PASSWORD" ]; then
            echo "Add SMOKE_EMAIL and SMOKE_PASSWORD to the testing environment secrets."
            exit 1
          fi
      - name: Download this run's frontend build
        if: needs.checks.outputs.rollback == 'false'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist
      - name: Download and verify the named release for rollback
        if: needs.checks.outputs.rollback == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.checks.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.checks.outputs.source_sha }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern frontend-dist.tar.gz --pattern release.json --dir "$RUNNER_TEMP/rollback"
          python3 - <<'PY'
          import hashlib, json, os, tarfile
          from pathlib import Path

          directory = Path(os.environ['RUNNER_TEMP']) / 'rollback'
          metadata = json.loads((directory / 'release.json').read_text())
          archive = directory / 'frontend-dist.tar.gz'
          if (metadata.get('tag') != os.environ['RELEASE_TAG']
                  or metadata.get('commit') != os.environ['SOURCE_SHA']
                  or metadata.get('environment') != 'testing'
                  or metadata.get('sha256') != hashlib.sha256(archive.read_bytes()).hexdigest()):
              raise SystemExit('Release metadata or archive checksum does not match.')
          with tarfile.open(archive) as files:
              files.extractall('dist', filter='data')
          PY
      - name: Validate settings and write public runtime configuration
        env:
          ROLLBACK: ${{ needs.checks.outputs.rollback }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          from urllib.parse import urlsplit

          bucket = os.environ['FRONTEND_S3_BUCKET']
          if not re.fullmatch(r'[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]', bucket):
              raise SystemExit('Set FRONTEND_S3_BUCKET to the testing bucket name.')
          url = os.environ['FRONTEND_URL'].rstrip('/')
          parsed = urlsplit(url)
          if (parsed.scheme != 'https' or not parsed.hostname or parsed.path
                  or parsed.query or parsed.fragment or parsed.username or parsed.password):
              raise SystemExit('Set FRONTEND_URL to the HTTPS origin, without a path.')
          # TEMPORARY rollback exercise: break new testing deployments only.
          # Rollbacks must retain the correct API URL so recovery remains possible.
          api_url = url if os.environ['ROLLBACK'] == 'true' else url + '/rollback-test-broken-api'
          config = {'apiBaseUrl': api_url, 'sentryDsn': '', 'sentryEnvironment': 'testing'}
          Path('dist/config.js').write_text('window.APP_CONFIG = ' + json.dumps(config) + ';\n')
          if not Path('dist/index.html').is_file():
              raise SystemExit('The frontend artifact is missing index.html.')
          PY
      - name: Authenticate to AWS with the testing deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      # Keep old hashed assets for browsers still running an earlier release.
      # No --delete: asset retention/cleanup can be configured separately.
      - name: Upload assets before switching the entry point
        run: |
          aws s3 sync dist/ "s3://$FRONTEND_S3_BUCKET/" \
            --exclude index.html --exclude config.js \
            --cache-control no-store --only-show-errors
          aws s3 cp dist/config.js "s3://$FRONTEND_S3_BUCKET/config.js" \
            --content-type application/javascript --cache-control no-store --only-show-errors
          aws s3 cp dist/index.html "s3://$FRONTEND_S3_BUCKET/index.html" \
            --content-type text/html --cache-control no-store --only-show-errors
      - name: Verify public files and React route rewriting
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --connect-timeout 10 --max-time 30 "$FRONTEND_URL/" -o /tmp/frontend-index.html
          cmp dist/index.html /tmp/frontend-index.html
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --connect-timeout 10 --max-time 30 "$FRONTEND_URL/config.js" -o /tmp/frontend-config.js
          cmp dist/config.js /tmp/frontend-config.js
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --connect-timeout 10 --max-time 30 "$FRONTEND_URL/tickets" -o /tmp/frontend-route.html
          cmp dist/index.html /tmp/frontend-route.html
      - name: Record deployment
        env:
          SOURCE_SHA: ${{ needs.checks.outputs.source_sha }}
          RELEASE_TAG: ${{ needs.checks.outputs.release_tag }}
          ROLLBACK: ${{ needs.checks.outputs.rollback }}
        run: |
          printf 'Frontend release: `%s`\n\nSource commit: `%s`\n\nRollback: `%s`\n\nURL: %s\n' \
            "$RELEASE_TAG" "$SOURCE_SHA" "$ROLLBACK" "$FRONTEND_URL" >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Verify deployed login and ticket navigation
    needs: deploy
    # A successful rollback has a skipped build ancestor; still run its browser checks.
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    # Keep Chromium system dependencies compatible with the pinned Playwright.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: testing
      url: ${{ vars.FRONTEND_URL }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      # Only the root test runner is needed; no frontend/server build or DB setup.
      - run: pnpm install --frozen-lockfile --filter resolvane
      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Run deployed browser smoke tests
        id: smoke
        env:
          SMOKE_BASE_URL: ${{ vars.FRONTEND_URL }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: pnpm test:smoke
      - name: Upload smoke-test report
        if: ${{ !cancelled() && steps.smoke.outcome != 'skipped' && steps.smoke.outcome != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-smoke-report
          path: |
            smoke/playwright-report/
            smoke/test-results/
          if-no-files-found: ignore
          retention-days: 3

  publish-release:
    name: Publish verified frontend release
    needs: [checks, smoke]
    if: ${{ !cancelled() && needs.checks.outputs.rollback == 'false' && needs.smoke.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.checks.outputs.release_tag }}
      SOURCE_SHA: ${{ needs.checks.outputs.source_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist
      - name: Package the original build and its release metadata
        run: |
          tar -czf "$RUNNER_TEMP/frontend-dist.tar.gz" -C dist .
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          directory = Path(os.environ['RUNNER_TEMP'])
          metadata = {
              'tag': os.environ['RELEASE_TAG'],
              'commit': os.environ['SOURCE_SHA'],
              'environment': 'testing',
              'workflow': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'sha256': hashlib.sha256((directory / 'frontend-dist.tar.gz').read_bytes()).hexdigest(),
          }
          (directory / 'release.json').write_text(json.dumps(metadata, indent=2) + '\n')
          (directory / 'release-notes.md').write_text(
              f"Frontend verified in testing by HTTP and browser smoke checks.\n\n"
              f"Commit: `{metadata['commit']}`\n\nWorkflow: {metadata['workflow']}\n\n"
              f"To restore, run Release frontend testing with rollback_version set to {metadata['tag'].removeprefix('frontend/v')}.\n"
          )
          PY
      - name: Publish the tag and retained build archive
        run: |
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/frontend-dist.tar.gz" "$RUNNER_TEMP/release.json" \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
            --title "$RELEASE_TAG (testing)" --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease --draft --latest=false
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
